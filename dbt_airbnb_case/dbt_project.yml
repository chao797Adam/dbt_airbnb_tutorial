name: 'dbt_airbnb_case'
version: '1.0.0'
config-version: 2

profile: 'dbt_airbnb_case'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_airbnb_case:
    
    staging:
      +schema: bronze
      +materialized: view
    
    intermediate:
      +schema: silver
      +materialized: incremental
      +incremental_strategy: merge  
      
    mart:
      +schema: gold
      +materialized: table

snapshots:
  dbt_airbnb_case:
    +target_schema: snapshots
    +strategy: timestamp
    +updated_at: ingested_at
